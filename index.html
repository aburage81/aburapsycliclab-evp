<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 脂心霊パラノーマルBOT - リアルタイム怪現象データベース</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { 
            background: #1a1a1a; 
            color: #ddd; 
            font-family: 'VT323', monospace; 
            margin: 0; 
            padding: 20px 10px; 
            min-height: 100vh;
        }
        .mac-window { 
            background: #c0c0c0; 
            border: 4px solid #fff; 
            border-right-color: #808080; 
            border-bottom-color: #808080; 
            box-shadow: 6px 6px 0 #000; 
            max-width: 1100px; 
            width: 100%; 
            margin: 0 auto; 
            overflow: hidden;
        }
        .title-bar { 
            background: linear-gradient(to right, #000080, #1084d0); 
            color: white; 
            padding: 6px 12px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            font-size: 18px; 
        }
        .content { padding: 20px; background: #111; }

        h1 { 
            font-size: 36px; text-align: center; margin: 0; 
            text-shadow: 3px 3px 0 #000; 
            cursor: pointer;
        }
        .subtitle { text-align: center; font-size: 22px; margin: 8px 0; color: #ffcc00; }
        .last-update { text-align: center; font-size: 16px; margin-bottom: 25px; color: #aaa; }

        .posts-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); 
            gap: 22px; 
        }
        
        .post { 
            background: #222; 
            border: 4px inset #fff; 
            border-right-color: #555; 
            border-bottom-color: #555; 
            padding: 18px; 
            position: relative;
            transition: transform 0.2s;
        }
        .post:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 15px rgba(255, 100, 100, 0.6);
        }
        
        .post-header { 
            font-weight: bold; 
            color: #ffcc00; 
            margin-bottom: 12px; 
            border-bottom: 2px dashed #555; 
            display: flex;
            justify-content: space-between;
            font-size: 18px;
        }

        .tag-link {
            color: #00ffff;
            cursor: pointer;
            text-decoration: underline;
        }
        .tag-link:hover { background: yellow; color: #000; }

        .post-body {
            font-size: 21px;
            line-height: 1.35;
            margin-bottom: 15px;
        }

        .media-container {
            margin: 15px 0;
            text-align: center;
            background: #000;
            padding: 8px;
            border: 2px solid #444;
        }
        .media-container img, .media-container video {
            max-width: 100%;
            height: auto;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .source-link { 
            color: #ff6666; 
            text-decoration: underline; 
            margin-top: 12px; 
            display: block; 
            font-size: 18px;
        }

        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        .page-btn { 
            padding: 10px 25px; background: #c0c0c0; border: 4px solid #fff; 
            border-right-color: #808080; border-bottom-color: #808080; cursor: pointer; 
            font-family: 'VT323'; font-size: 22px; box-shadow: 3px 3px 0 #000; 
        }
    </style>
</head>
<body>
    <div class="mac-window">
        <div class="title-bar">
            <div>📂 リアルタイム怪現象データベース</div>
            <div style="font-size: 14px;">[Ver 5.6.2 - メディア対応]</div>
        </div>
        <div class="content">
            <h1 onclick="location.href='./';">👻 脂心霊パラノーマルBOT</h1>
            <p class="subtitle">世界各地からの自動収集・要約アーカイブ 🛢️</p>
            <p id="last-update" class="last-update">LAST UPDATE: ---</p>
            
            <!-- タグフィルターはそのまま -->
            <div class="search-container" style="margin-bottom:25px;">
                <select id="tagFilter" class="tag-select" onchange="filterPosts()" style="width:100%; max-width:600px; padding:12px; font-size:22px;">
                    <option value="">ALL TAGS (全記事を表示)</option>
                    <option value="#Audio">#Audio (音声/EVP)</option>
                    <option value="#Orb">#Orb (光球)</option>
                    <option value="#Physical">#Physical (物理現象)</option>
                    <!-- 他のタグも必要なら追加 -->
                </select>
            </div>
            
            <div class="posts-grid" id="posts"></div>
            
            <div class="pagination">
                <button id="prevBtn" class="page-btn" onclick="changePage(-1)">PREV</button>
                <span id="pageInfo" style="font-size:24px; align-self:center; color:#ffcc00;">PAGE 1</span>
                <button id="nextBtn" class="page-btn" onclick="changePage(1)">NEXT</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA START ---
        const posts = [
            {
                "date": "2026-05-24 11:11",
                "source": "Global Node",
                "text": "#NHI 起こり得る超常現象体験とNHI/UAPの相関関係",
                "url": "https://www.reddit.com/r/Paranormal/comments/1tlz03g/possible_paranormal_experience_and_nhiuap/",
                "media": []  // ← 将来的にここに自動挿入
            },
            {
                "date": "2026-05-24 01:50",
                "source": "Global Node",
                "text": "#Paranormal 幽霊は住んだことのない家を訪れることはあるのでしょうか？ (ビデオ録画)",
                "url": "https://www.reddit.com/r/Paranormal/comments/1tlkyle/can_ghosts_visit_homes_they_never_lived_in_video/",
                "media": [  // サンプル（実際はGitHub Actionsで自動取得）
                    { "type": "video", "url": "https://example.com/sample-video.mp4" }
                ]
            },
            // 他の投稿も同じ形式で "media": [] を追加してください
            // ...（省略。残りの投稿はすべて "media": [] を付けてください）
        ];
        const lastUpdated = "2026-05-24 11:11";
        // --- DATA END ---

        let currentPage = 1;
        const postsPerPage = 10;
        let filteredPosts = [...posts];

        function render() {
            document.getElementById('last-update').innerText = `LAST UPDATE: ${lastUpdated} (JST) 🛢️`;
            
            const start = (currentPage - 1) * postsPerPage;
            const end = start + postsPerPage;
            const target = filteredPosts.slice(start, end);
            const container = document.getElementById('posts');

            container.innerHTML = target.map(p => {
                const tagMatch = p.text.match(/^(#[a-zA-Z]+)(.*)/);
                const tag = tagMatch ? tagMatch[1] : "#Paranormal";
                const body = tagMatch ? tagMatch[2].trim() : p.text;

                // メディア表示部分
                let mediaHTML = '';
                if (p.media && p.media.length > 0) {
                    mediaHTML = p.media.map(m => {
                        if (m.type === 'image') {
                            return `<div class="media-container"><img src="${m.url}" alt="脂心霊メディア" loading="lazy"></div>`;
                        } else if (m.type === 'video') {
                            return `<div class="media-container"><video controls muted loop><source src="${m.url}" type="video/mp4"></video></div>`;
                        }
                        return '';
                    }).join('');
                }

                return `
                    <div class="post">
                        <div class="post-header">
                            <span>${p.date}</span>
                            <span class="tag-link" onclick="quickFilter('${tag}')">${tag}</span>
                        </div>
                        <div class="post-body">${body}</div>
                        ${mediaHTML}
                        <a href="${p.url}" target="_blank" class="source-link">🔗 元Reddit投稿を確認（画像・動画あり）</a>
                    </div>
                `;
            }).join('');

            document.getElementById('pageInfo').innerText = `PAGE ${currentPage}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = end >= filteredPosts.length;
        }

        function filterPosts() {
            const tagTerm = document.getElementById('tagFilter').value;
            filteredPosts = posts.filter(p => !tagTerm || p.text.includes(tagTerm));
            currentPage = 1;
            render();
        }

        function quickFilter(tag) {
            document.getElementById('tagFilter').value = tag;
            filterPosts();
            window.scrollTo(0, 0);
        }

        function changePage(dir) {
            currentPage += dir;
            render();
            window.scrollTo(0, 0);
        }

        render();
    </script>
</body>
</html>
