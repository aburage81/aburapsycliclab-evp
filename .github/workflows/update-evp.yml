name: 脂心霊 1時間更新

on:
  schedule:
    - cron: '0 * * * *'   # 1時間ごと
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser deep-translator
      - run: python update_evp.py
      - run: |
          git config user.name "脂心霊BOT"
          git config user.email "bot@aburage81.github.io"
          git add index.html
          git commit -m "自動更新" || echo "No changes"
          git push
